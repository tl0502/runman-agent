name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test Agent and installer
        env:
          CGO_ENABLED: 0
        run: |
          go test -tags containers_image_openpgp ./...
          bash -n install.sh
          python3 -m unittest discover -s tests -v
          bash install.sh --help >/dev/null
          status_output="$(bash install.sh --status)"
          if grep -q 'Select language' <<<"$status_output"; then
            echo 'one-shot status unexpectedly prompted for language' >&2
            exit 1
          fi
          printf '0\n' | bash install.sh zh --menu >/dev/null
          bash install.sh en --validate-ipv6 --ipv6-mode subnet \
            --ipv6-addr 2001:db8:100::1 --ipv6-subnet 2001:db8:100::/64 \
            --ipv6-iface lo --ipv6-routed --skip-ipv6-probe --non-interactive
          bash install.sh en --validate-ipv6 --ipv6-mode subnet \
            --ipv6-addr 2001:db8:200::1 --ipv6-subnet 2001:db8:200::/64 \
            --ipv6-iface lo --skip-ipv6-probe --non-interactive
          if bash install.sh en --validate-ipv6 --ipv6-mode subnet \
            --ipv6-addr 2001:db8:300::1 --ipv6-subnet 2001:db8:301::/64 \
            --ipv6-iface lo --skip-ipv6-probe --non-interactive; then
            echo 'invalid IPv6 values unexpectedly passed validation' >&2
            exit 1
          fi

  build-agent:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goarch: amd64
          - goarch: arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build Agent
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          # 发布以语义化 tag 为准（vX.Y.Z）；main 上的构建只用于验证，不产生 release，
          # 版本号标成 dev-<sha7>，updater 会据此跳过自动更新。
          build_version="${{ github.ref_name }}"
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            build_version="dev-${GITHUB_SHA:0:7}"
          fi
          go build \
            -tags containers_image_openpgp \
            -ldflags="-s -w -X main.version=${build_version} -X main.commit=${GITHUB_SHA:0:7}" \
            -o runman-agent-linux-${{ matrix.goarch }} \
            .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: runman-agent-linux-${{ matrix.goarch }}
          path: runman-agent-linux-${{ matrix.goarch }}
          retention-days: 1

  fetch-rfw:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: amd64
          - arch: arm64

    steps:
      # rfw 不再从上游源码构建：本 fork 不维护 rfw，直接取上游 continuous
      # 发布里那份二进制，保证与官方构建字节一致。
      - name: Download prebuilt rfw
        run: |
          curl -fsSL --retry 3 --retry-delay 5 -o "rfw-${{ matrix.arch }}" \
            "https://github.com/narwhal-cloud/runman-agent/releases/download/continuous/rfw-${{ matrix.arch }}"
          test -s "rfw-${{ matrix.arch }}"

      - name: Verify it is an ELF64 binary
        run: |
          file "rfw-${{ matrix.arch }}" | grep -q 'ELF 64-bit'
          chmod +x "rfw-${{ matrix.arch }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rfw-${{ matrix.arch }}
          path: rfw-${{ matrix.arch }}
          retention-days: 1

  release:
    # 只有打语义化 tag 才发布；推 main 仅跑测试与构建。
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build-agent, fetch-rfw]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            runman-agent-linux-amd64
            runman-agent-linux-arm64
            install.sh
            rfw-amd64
            rfw-arm64
          generate_release_notes: true
